name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Debug APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Version Info ==="
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          
          JAVA_VER=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          echo "Detected Java version string: $JAVA_VER"
          
          if [ -z "$JAVA_VER" ]; then
            echo "::error::Could not detect Java version."
            exit 1
          fi
          
          MAJOR_VER=$(echo "$JAVA_VER" | sed -E 's/^1\.//; s/[^0-9].*//')
          echo "Detected Java Major Version: $MAJOR_VER"
          
          if [ "$MAJOR_VER" -lt 17 ]; then
            echo "::error::Java version is $MAJOR_VER, which is lower than required version 17."
            exit 1
          fi
          echo "Java environment verified successfully (version $MAJOR_VER >= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "Debug keystore already exists at ./debug.keystore"
          else
            echo "Generating temporary debug keystore..."
            keytool -genkeypair \
              -v \
              -keystore ./debug.keystore \
              -alias androiddebugkey \
              -keypass android \
              -storepass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "::error::Failed to verify ./debug.keystore existence after generation."
            exit 1
          fi
          echo "Temporary debug keystore is ready."

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "::error::Expected APK file not found at $EXPECTED_APK"
            echo "Searching app/build/outputs/apk for any generated APKs:"
            find app/build/outputs/apk -name "*.apk" -type f || true
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "::error::APK file exists but is empty: $EXPECTED_APK"
            exit 1
          fi

          case "$EXPECTED_APK" in
            *.apk) ;;
            *) echo "::error::File does not have .apk extension: $EXPECTED_APK"; exit 1 ;;
          esac

          echo "APK verified successfully: $EXPECTED_APK (size: $(stat -c%s "$EXPECTED_APK") bytes)"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          REPO_RAW="${{ github.repository }}"
          REPO_NAME="${REPO_RAW##*/}"
          SANITIZED_NAME=$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-zA-Z0-9._-]/-/g')
          ASSET_NAME="${SANITIZED_NAME}-debug-build-${{ github.run_number }}.apk"
          
          TEMP_RELEASE_DIR="${{ runner.temp }}/release_asset"
          mkdir -p "$TEMP_RELEASE_DIR"
          
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          TARGET_APK="${TEMP_RELEASE_DIR}/${ASSET_NAME}"
          
          cp "$SOURCE_APK" "$TARGET_APK"
          
          if [ ! -s "$TARGET_APK" ]; then
            echo "::error::Failed to prepare release asset at $TARGET_APK"
            exit 1
          fi
          
          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          
          echo "asset_path=$TARGET_APK" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_NAME" >> "$GITHUB_OUTPUT"
          echo "release_tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset: $TARGET_APK with tag: $TAG_NAME"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          RELEASE_TAG="${{ steps.prepare_asset.outputs.release_tag }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "::error::Release asset is invalid or missing at $ASSET_PATH"
            exit 1
          fi
          
          RELEASE_NOTES=$(cat <<EOF
          ### 📱 Automated Debug APK Build

          This is an automatically generated debug APK built by GitHub Actions.

          - **Run Number:** #${{ github.run_number }}
          - **Run Attempt:** #${{ github.run_attempt }}
          - **Source Commit SHA:** \`${{ github.sha }}\`
          - **Intended Use:** For testing and preview purposes only.
          - **Signing:** Signed with a temporary debug keystore (not a Play Store production release).

          Download the \`.apk\` directly from the Assets section below.
          EOF
          )
          
          echo "Creating GitHub Release $RELEASE_TAG..."
          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --target "${{ github.sha }}" \
            --latest
            
          echo "Release created successfully."

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="${{ steps.prepare_asset.outputs.release_tag }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          
          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "=== GitHub Release Published Successfully ==="
            RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url -q .url 2>/dev/null || echo "https://github.com/${{ github.repository }}/releases/tag/${RELEASE_TAG}")
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: Debug APK Build #${{ github.run_number }}"
            echo "Release URL: $RELEASE_URL"
            echo "Asset Filename: $ASSET_NAME"
            
            {
              echo "## 🚀 Debug APK Build & Release Summary"
              echo ""
              echo "✅ **Debug APK built and released successfully!**"
              echo ""
              echo "- **Direct Release Page:** [$RELEASE_TAG]($RELEASE_URL)"
              echo "- **APK Asset File:** \`$ASSET_NAME\`"
              echo ""
              echo "📱 You can download the APK directly to your phone from the **Assets** section of the [Release Page]($RELEASE_URL)."
              echo "📦 The standard GitHub Actions artifact **\`app-debug-apk\`** is also retained as a backup."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing was skipped or encountered an issue."
            echo "The APK build and Actions artifact upload succeeded."
            echo "Artifact name: app-debug-apk"
            
            {
              echo "## ⚠️ Debug APK Build Summary"
              echo ""
              echo "✅ **Debug APK built and artifact uploaded successfully!**"
              echo ""
              echo "⚠️ *GitHub Release publishing could not be completed or was skipped, but your build artifact is safe.*"
              echo ""
              echo "📦 **Backup Artifact:** You can download **\`app-debug-apk\`** directly from the **Artifacts** section of this GitHub Actions run."
            } >> "$GITHUB_STEP_SUMMARY"
          fi